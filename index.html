<!doctype html>
<html lang="en" data-default-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policy Lab: simulate and debug Tailscale policy files</title>
    <meta name="description" content="Paste a tailnet policy file and see who can reach what, why a connection is denied, and what a change would open up. Runs entirely in your browser." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f1e1e'/><text x='16' y='21.5' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='%23faf9f8'>PL</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q || localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : 'light'
        if (q === 'light' || q === 'dark') localStorage.setItem('themeMode', q)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
